[project]
name = "target-released"
version = "0.1.0"
description = "`target-released` is a Singer target for ReLeased, built with the Meltano SDK for Singer Targets."
authors = [{ name = "Hotglue", email = "hello@hotglue.io" }]
keywords = [
    "ELT",
    "released",
]
license = "Apache-2.0"
requires-python = "<3.11,>=3.7.1"
dependencies = [
    "requests>=2.25.1",
    "hotglue-singer-sdk>=1.0.11",
]

[project.scripts]
target-released = 'target_released.target:TargetReLeased.cli'

[dependency-groups]
dev = [
    "pytest>=7",
    "ruff>=0.15",
]

[tool.ruff]
line-length = 100
required-version = ">=0.15"
exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    ".secrets",
    "etl",
]

[tool.ruff.lint]
future-annotations = true
ignore = [
    "COM812",
    "CPY001",
    "FIX002",
    "TD002",
    "TD003",
]
select = ["ALL"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ANN",
    "ARG",
    "D100",
    "D103",
    "EM",
    "PLC0415",
    "PLR2004",
    "S101",
    "TRY003",
]
"target_released/client.py" = [
    "ANN401",
    "ARG002",
    "I001",
]
"target_released/sinks.py" = [
    "ANN002",
    "ANN003",
    "ARG002",
    "I001",
]
"target_released/target.py" = [
    "RUF012",
    "I001",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
requires = ["poetry-core>=1.0.8"]
build-backend = "poetry.core.masonry.api"
